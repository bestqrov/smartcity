<style>
:root{--bg:#fff;--fg:#0f172a;--muted:#64748b;--card:#f8fafc;--line:#e2e8f0;--brand:#4f46e5;--brand2:#7c3aed;--accent:#f59e0b;--hero:linear-gradient(180deg,#eef2ff,#fff)}
body.dark{--bg:#0b1020;--fg:#f1f5f9;--muted:#94a3b8;--card:#131a30;--line:#22294a;--brand:#818cf8;--brand2:#a78bfa;--hero:radial-gradient(1200px 500px at 70% -10%,#312e81 0,transparent 60%),#0b1020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Cairo,system-ui,sans-serif;line-height:1.55}
[dir=rtl] body,body[dir=rtl]{font-family:Cairo,Inter,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal}
.nav-r{display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn{display:inline-block;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;padding:12px 22px;font-weight:700;border:0;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hero{background:var(--hero);padding:56px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
body.center .hero .wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
body.center .mock{display:none}
.badge{display:inline-block;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
h1{font-size:44px;line-height:1.15;margin:14px 0;font-weight:800}
.hero p{color:var(--muted);font-size:18px;max-width:520px}
.cta{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
body.center .cta{justify-content:center}
.mock.illus{padding:0;overflow:hidden}.mock{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 30px 60px -30px rgba(79,70,229,.45)}
.mock .bar{display:flex;gap:6px;margin-bottom:12px}.mock .bar b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);margin-bottom:8px;font-size:14px}
.ok{color:#10b981;font-weight:700}.late{color:#f59e0b;font-weight:700}.abs{color:#ef4444;font-weight:700}
.stats{display:flex;gap:28px;justify-content:center;padding:26px 0;border-block:1px solid var(--line);flex-wrap:wrap}
.stats div{text-align:center}.stats b{display:block;font-size:26px}.stats span{color:var(--muted);font-size:13px}
section{padding:60px 0}
h2{font-size:30px;text-align:center;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);margin-bottom:34px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.feat .ic{font-size:26px}.feat h3{margin:10px 0 4px;font-size:17px}.feat p{margin:0;color:var(--muted);font-size:14px}
.feat.wide{grid-column:1/-1;display:flex;gap:16px;align-items:center;border-color:var(--brand)}.feat.wide .ic{font-size:34px}.toggle{display:flex;justify-content:center;gap:8px;margin-bottom:26px}
.toggle .pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.price{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative}
.price.pop{border:2px solid var(--brand);transform:translateY(-6px)}
.price .tag{position:absolute;top:-12px;inset-inline-start:20px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px}
.price h3{margin:0}.amount{font-size:38px;font-weight:800;margin:10px 0 0}.amount small{font-size:14px;color:var(--muted);font-weight:600}
.limit{color:var(--muted);font-size:13px;margin-bottom:12px}
.price ul{list-style:none;padding:0;margin:14px 0 18px}.price li{padding:5px 0;font-size:14px}.price li::before{content:"✓";color:#10b981;font-weight:800;margin-inline-end:8px}.price li.off{color:var(--muted);opacity:.55}.price li.off::before{content:"–";color:var(--muted)}
.price .btn{width:100%;text-align:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{text-align:center}.step b{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 10px;border-radius:50%;background:var(--brand);color:#fff}
.final{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:40px;text-align:center}
.final .btn{background:#fff;color:#4f46e5;margin-top:14px}
footer{padding:30px 0;color:var(--muted);text-align:center;font-size:13px}
.wa{position:fixed;inset-inline-end:18px;bottom:18px;background:#22c55e;color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 10px 30px rgba(34,197,94,.45)}
.switch{position:fixed;inset-inline-start:14px;bottom:14px;z-index:9;background:#111827;color:#fff;border-radius:12px;padding:8px;display:flex;gap:6px;font-size:12px}
.switch button{border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
@media(max-width:820px){.hero .wrap,.grid3,.steps{grid-template-columns:1fr}h1{font-size:32px}.mock{order:2}.price.pop{transform:none}}
</style>
</head>
